<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2430">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Gari Soko</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#ffffff;--ink:#1f2933;--mute:#66707c;--line:#dde2e8;--accent:#d9a62e;--green:#2f7d5b;--bar:#243342;--shadow:0 1px 3px rgba(31,41,51,.08),0 4px 14px rgba(31,41,51,.05)}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222b;--ink:#e8ebee;--mute:#98a3b0;--line:#2b3541;--green:#58b88f;--bar:#0d1217;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
header{background:#1b2430;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.3rem}h1 span{background:var(--accent);color:#1b2430;padding:0 8px;border-radius:4px;margin-right:6px}
nav{display:flex;gap:4px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:9px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mute)}
nav button.on{background:var(--accent);color:#1b2430}
main{max-width:980px;margin:0 auto;padding:16px}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:600;background:var(--accent);color:#1b2430;text-decoration:none;text-align:center;display:inline-block}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:#25a244;color:#fff}.btn.bad{background:#b3261e;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.car,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel{padding:14px;margin-bottom:14px}
.pic{height:170px;background:#2f5d7c center/cover}
.body{padding:12px;display:flex;flex-direction:column;gap:4px}
.price{font-weight:800;font-size:1.2rem}.meta{color:var(--mute);font-size:.88rem}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.co{border-color:var(--green);color:var(--green)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/3}
@media(max-width:560px){.f{grid-template-columns:1fr}.f .w{grid-column:1}}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:14px}
.empty{color:var(--mute);padding:24px;text-align:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.chat{display:grid;grid-template-columns:240px 1fr;gap:12px}
@media(max-width:700px){.chat{grid-template-columns:1fr}}
.threads button{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;font:inherit}
.threads button.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.msgs{display:flex;flex-direction:column;gap:6px;min-height:220px;max-height:340px;overflow-y:auto;margin-bottom:10px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--accent);color:#1b2430;border-color:transparent}
.send{display:flex;gap:8px}
.q{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ans{margin:6px 0 0 14px;padding-left:10px;border-left:3px solid var(--green)}
.pimg{width:100%;max-height:520px;object-fit:cover;display:block;background:#2f5d7c}
.acts .btn{padding:8px 6px}.acts .sel{background:var(--accent);color:#1b2430;border-color:transparent}
.lnk{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:.85rem;padding:4px 0}
.feedcol{max-width:560px;margin:0 auto}

/* ===== softer look ===== */
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--bar)}
nav{background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
nav button{border-radius:10px}
nav button.on{background:var(--accent);color:#1f2933}
.car,.panel{border-radius:14px;box-shadow:var(--shadow);border-color:var(--line)}
.btn{background:var(--accent);color:#1f2933;border-radius:10px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#2f8f5b;color:#fff}.btn.bad{background:#b04a45;color:#fff}
input,select,textarea{border-radius:10px;background:var(--card);color:var(--ink)}
.price{color:var(--ink)}
.grid.mini{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mini .pic{height:110px}.mini .body{padding:10px;gap:2px}.mini .price{font-size:1rem}.mini strong{font-size:.92rem}
.car.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.car.click:hover{transform:translateY(-2px)}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
.replies{margin-left:16px;border-left:2px solid var(--line);padding-left:8px}
#toast{background:var(--bar)}

.avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#1f2933;font-weight:800;cursor:pointer;overflow:hidden;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.sm{width:34px;height:34px}.avatar.big{width:72px;height:72px;font-size:1.8rem;cursor:default}
.un{color:inherit;text-decoration:none;font-weight:700;cursor:pointer}.un:hover{text-decoration:underline}
.crown{vertical-align:-3px;margin-left:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<header><div style="display:flex;gap:8px;align-items:center"><button id="back" class="btn alt" style="display:none;color:#fff;border-color:#ffffff55;padding:6px 12px" onclick="goBack()" aria-label="Go back">←</button><h1><span>Gari</span>Soko</h1></div><div style="display:flex;gap:8px;align-items:center"><div id="who"></div><button id="theme" class="btn alt" style="color:#fff;border-color:#ffffff55;padding:6px 10px" aria-label="Switch light or dark mode">🌙</button></div></header>
<nav id="nav"></nav>
<main id="view"></main>
<button id="inst" class="btn" style="display:none;position:fixed;right:14px;bottom:14px;z-index:8">Install app</button>
<div id="toast" role="status"></div>
<script>
// ====== STEP 1: PASTE YOUR TWO SUPABASE VALUES BETWEEN THE QUOTES ======
const SUPABASE_URL = "https://odvraclnvjwlvzrmjxsn.supabase.co";
const SUPABASE_KEY = "sb_publishable_RkQVJ7BZ6kCSApLunK9fMw_I92Zg7JJ";
// =======================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => "KSh " + Number(n).toLocaleString("en-KE");
const photoUrl = p => db.storage.from("vehicle-photos").getPublicUrl(p).data.publicUrl;
let me = null, profile = null, tab = "home", cars = [], fq = "", fm = "";

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",3000)}

async function refreshUser(){
  const { data:{ user } } = await db.auth.getUser();
  me = user; profile = null;
  if (me) { const { data } = await db.from("profiles").select("*").eq("id", me.id).single(); profile = data; }
  $("#who").innerHTML = me ? `<button class="avatar" title="My profile" onclick="openProfile('${me.id}')">${avatarInner(profile)}</button> <button class="btn alt" style="color:#fff;border-color:#ffffff55;padding:6px 10px" onclick="logout()">Log out</button>` : "";
  drawNav(); render();
}
async function logout(){ await db.auth.signOut(); tab="home"; refreshUser(); }

function drawNav(){
  const t = {home:"Home", browse:"Vehicles", feed:"Photo feed", groups:"Groups", mech:"Mechanics & advice"};
  if (me && profile?.role !== "mechanic" && profile?.role !== "buyer") t.sell = "Sell a vehicle";
  if (me && profile?.role === "buyer") t.sell = "Sell a vehicle";
  if (me) t.chat = "Messages";
  if (profile?.role === "admin") t.admin = "Approve listings";
  if (!me) t.login = "Log in / Sign up";
  $("#nav").innerHTML = Object.entries(t).map(([k,v]) => `<button class="${k===tab?"on":""}" onclick="go('${k}')">${v}</button>`).join("");
}
function go(t, quiet){ tab=t; drawNav(); render(); if (!quiet) push("tab", t); }
function render(){ (({home, browse, sell, admin, login, mech, chat, feed, groups})[tab] || (() => {}))(); }

// ---------- Browse ----------
async function browse(){
  $("#view").innerHTML = '<div class="empty">Loading vehicles...</div>';
  const { data, error } = await db.from("listings")
    .select("*, listing_photos(path), profiles!listings_seller_id_fkey(full_name, business_name, role, verified, followers_count, avatar_path)")
    .eq("status","approved").order("created_at",{ascending:false});
  if (error) { $("#view").innerHTML = `<div class="empty">Could not load: ${esc(error.message)}</div>`; return; }
  cars = data; drawCars(true);
}
function drawCars(first){
  const makes = [...new Set(cars.map(c=>c.make))].sort();
  const list = cars.filter(c => (c.make+" "+c.model+" "+c.town).toLowerCase().includes(fq.toLowerCase()) && (!fm || c.make===fm));
  $("#view").innerHTML = `<div class="filters"><input id="fq" placeholder="Search make, model or town" value="${esc(fq)}">
  <select id="fm"><option value="">All makes</option>${makes.map(m=>`<option ${m===fm?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
  <div class="grid mini">${list.map(miniCard).join("") || '<div class="empty">No approved vehicles yet. Be the first to post one.</div>'}</div>`;
  $("#fq").oninput = e => { fq=e.target.value; const p=e.target.selectionStart; drawCars(); const n=$("#fq"); n.focus(); n.setSelectionRange(p,p); };
  $("#fm").onchange = e => { fm=e.target.value; drawCars(); };
}
function card(c){
  const img = c.listing_photos?.[0] ? `style="background-image:url('${photoUrl(c.listing_photos[0].path)}')"` : "";
  const s = c.profiles || {}; const co = s.role === "company";
  const wa = String(c.whatsapp||"").replace(/\D/g,"");
  return `<article class="car"><div class="pic" ${img}></div><div class="body">
  <div class="price">${fmt(c.price)}</div><strong>${c.year} ${esc(c.make)} ${esc(c.model)}</strong>
  <div class="meta">${esc(c.town)}</div>
  <div><span class="tag ${co?"co":""}">${co?"Company":"Private"}${s.verified?" · Verified":""}</span> ${esc(s.business_name || s.full_name || "")}</div>
  <div class="meta">${esc(c.description||"")}</div>
  <div class="row"><button class="btn" onclick="openChat('${c.id}','${c.seller_id}')">Chat</button>${wa?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent("Hi, is the "+c.year+" "+c.make+" "+c.model+" still available?")}">WhatsApp</a>`:""}
  <button class="btn alt" onclick="reportListing('${c.id}')">Report</button></div></div></article>`;
}
async function reportListing(id){
  if (!me) { toast("Log in to report a listing"); return go("login"); }
  const reason = prompt("Why are you reporting this listing?"); if (!reason) return;
  const { error } = await db.from("reports").insert({ listing_id:id, reporter_id:me.id, reason });
  toast(error ? error.message : "Thanks, we will check it");
}

// ---------- Sell ----------
function sell(){
  $("#view").innerHTML = `<div class="panel"><h2>List a vehicle for free</h2>
  <p class="meta">Your ad appears after we check it.</p>
  <form class="f" id="sf"><div><label>Make</label><input name="make" required placeholder="Toyota"></div>
  <div><label>Model</label><input name="model" required placeholder="Axio"></div>
  <div><label>Year</label><input name="year" type="number" min="1980" max="2030" required value="2015"></div>
  <div><label>Price (KSh)</label><input name="price" type="number" min="1" required></div>
  <div><label>Town</label><input name="town" required placeholder="Nairobi"></div>
  <div><label>WhatsApp number</label><input name="whatsapp" required placeholder="2547XXXXXXXX"></div>
  <div class="w"><label>Description</label><textarea name="description" rows="3"></textarea></div>
  <div class="w"><label>Photos (1 to 6, real photos of the vehicle)</label><input name="photos" type="file" accept="image/*" multiple required></div>
  <div class="w"><button class="btn" id="sb" type="submit">Submit listing</button></div></form></div>`;
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const files = [...e.target.photos.files].slice(0,6);
    $("#sb").disabled = true; $("#sb").textContent = "Uploading...";
    const { data:l, error } = await db.from("listings").insert({
      seller_id: me.id, make:f.get("make"), model:f.get("model"), year:+f.get("year"), price:+f.get("price"),
      town:f.get("town"), whatsapp:f.get("whatsapp"), description:f.get("description") }).select().single();
    if (error) { toast(error.message); $("#sb").disabled=false; $("#sb").textContent="Submit listing"; return; }
    for (let i=0;i<files.length;i++){
      const blob = await shrink(files[i]); const path = `${me.id}/${l.id}-${i}.jpg`;
      const up = await db.storage.from("vehicle-photos").upload(path, blob, {contentType:"image/jpeg"});
      if (!up.error) await db.from("listing_photos").insert({ listing_id:l.id, path });
    }
    toast("Submitted. It will show once approved."); go("browse");
  };
}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1000/img.width);const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};img.src=URL.createObjectURL(file)})}

// ---------- Admin ----------
async function admin(){
  const { data, error } = await db.from("listings").select("*, listing_photos(path)").eq("status","pending").order("created_at");
  if (error) { $("#view").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  $("#view").innerHTML = data.length ? `<div class="grid">${data.map(c=>card(c).replace(/<div class="row">.*<\/div><\/div><\/article>$/s,
    `<div class="row"><button class="btn" onclick="decide('${c.id}','approved')">Approve</button><button class="btn bad" onclick="decide('${c.id}','rejected')">Reject</button></div></div></article>`)).join("")}</div>`
    : '<div class="empty">Nothing waiting for approval.</div>';
}
async function decide(id, status){
  const { error } = await db.from("listings").update({ status }).eq("id", id);
  toast(error ? error.message : "Listing " + status); admin();
}

// ---------- Log in / Sign up ----------
function login(){
  $("#view").innerHTML = `<div class="panel"><h2>Log in</h2><form class="f" id="lf">
  <div><label>Email</label><input name="email" type="email" required></div>
  <div><label>Password</label><input name="password" type="password" required></div>
  <div class="w"><button class="btn" type="submit">Log in</button></div></form></div>
  <div class="panel"><h2>New here? Sign up</h2><form class="f" id="sg">
  <div><label>Your name</label><input name="full_name" required></div>
  <div><label>Phone</label><input name="phone" placeholder="2547XXXXXXXX"></div>
  <div><label>Email</label><input name="email" type="email" required></div>
  <div><label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required></div>
  <div class="w"><label>I am a</label><select name="role"><option value="buyer">Buyer</option><option value="seller">Private seller</option><option value="company">Company / dealer</option><option value="mechanic">Mechanic</option></select></div>
  <div class="w"><button class="btn" type="submit">Create account</button></div></form></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
    const { error } = await db.auth.signInWithPassword({ email:f.email, password:f.password });
    if (error) return toast(error.message); tab="home"; refreshUser(); };
  $("#sg").onsubmit = async e => { e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
    const { data, error } = await db.auth.signUp({ email:f.email, password:f.password, options:{ data:{ full_name:f.full_name, phone:f.phone, role:f.role } } });
    if (error) return toast(error.message);
    if (!data.session) return toast("Check your email to confirm, then log in");
    tab="home"; refreshUser(); };
}

// ---------- Chat ----------
let activeConv = null, chan = null, shown = new Set();
async function openChat(listingId, sellerId){
  if (!me) { toast("Log in to chat with the seller"); return go("login"); }
  if (me.id === sellerId) return toast("This is your own listing");
  let { data:c } = await db.from("conversations").select("id").eq("listing_id",listingId).eq("buyer_id",me.id).maybeSingle();
  if (!c) {
    const r = await db.from("conversations").insert({ listing_id:listingId, buyer_id:me.id, seller_id:sellerId }).select("id").single();
    if (r.error) return toast(r.error.message);
    c = r.data;
  }
  activeConv = c.id; go("chat");
}
function addMsg(m){
  if (shown.has(m.id)) return; shown.add(m.id);
  const box = $("#ms"); if (!box) return;
  const d = document.createElement("div"); d.className = "m" + (m.sender_id===me.id ? " me" : ""); d.textContent = m.body;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
async function chat(){
  if (!me) return go("login");
  $("#view").innerHTML = '<div class="empty">Loading messages...</div>';
  const { data:convs, error } = await db.from("conversations")
    .select("id,buyer_id,seller_id,listings(make,model,year),buyer:profiles!conversations_buyer_id_fkey(full_name),seller:profiles!conversations_seller_id_fkey(full_name)")
    .order("created_at",{ascending:false});
  if (error) { $("#view").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!convs.length) { $("#view").innerHTML = '<div class="empty">No conversations yet. Open a vehicle and tap Chat to message the seller.</div>'; return; }
  if (!convs.find(c => c.id === activeConv)) activeConv = convs[0].id;
  const title = c => { const l=c.listings; const other = me.id===c.buyer_id ? c.seller : c.buyer;
    return esc((l ? l.year+" "+l.make+" "+l.model : "Vehicle") + " · " + (other?.full_name || "User")); };
  const { data:ms } = await db.from("messages").select("*").eq("conversation_id",activeConv).order("created_at");
  shown = new Set(ms.map(m => m.id));
  const cur = convs.find(c => c.id === activeConv);
  $("#view").innerHTML = `<div class="chat"><div class="threads">${convs.map(c=>`<button class="${c.id===activeConv?"on":""}" onclick="activeConv='${c.id}';chat()">${title(c)}</button>`).join("")}</div>
  <div class="panel"><h3>${title(cur)}</h3><div class="msgs" id="ms">${ms.map(m=>`<div class="m ${m.sender_id===me.id?"me":""}">${esc(m.body)}</div>`).join("")}</div>
  <div class="send"><input id="mi" placeholder="Type a message" maxlength="2000"><button class="btn" id="sb2">Send</button></div></div></div>`;
  const box = $("#ms"); box.scrollTop = box.scrollHeight;
  if (chan) db.removeChannel(chan);
  const id = activeConv;
  chan = db.channel("m"+id).on("postgres_changes", { event:"INSERT", schema:"public", table:"messages", filter:"conversation_id=eq."+id }, p => addMsg(p.new)).subscribe();
  const send = async () => { const v=$("#mi").value.trim(); if(!v) return; $("#mi").value="";
    const r = await db.from("messages").insert({ conversation_id:id, sender_id:me.id, body:v }).select().single();
    if (r.error) toast(r.error.message); else addMsg(r.data); };
  $("#sb2").onclick = send; $("#mi").onkeydown = e => { if (e.key==="Enter") send(); };
}

// ---------- Mechanics & advice ----------
async function mech(){
  $("#view").innerHTML = '<div class="empty">Loading...</div>';
  const [q, m] = await Promise.all([
    db.from("questions").select("id,body,profiles!questions_author_id_fkey(full_name),answers(id,body,profiles!answers_mechanic_id_fkey(full_name,verified))").order("created_at",{ascending:false}),
    db.from("profiles").select("full_name,business_name,town,verified").eq("role","mechanic")]);
  if (q.error) { $("#view").innerHTML = `<div class="empty">${esc(q.error.message)}</div>`; return; }
  const isM = profile?.role === "mechanic";
  $("#view").innerHTML = `<div class="panel"><h2>Ask a mechanic</h2>
  <div class="send"><input id="nq" placeholder="Describe the problem, e.g. car overheats in traffic"><button class="btn" id="pq">Post</button></div></div>
  <div class="panel"><h3>Questions</h3>${q.data.map(x=>`<div class="q"><strong>${esc(x.profiles?.full_name||"User")}</strong><div>${esc(x.body)}</div>
  ${(x.answers||[]).map(a=>`<div class="ans"><span class="meta">${esc(a.profiles?.full_name||"Mechanic")}${a.profiles?.verified?" · Verified":""}</span><div>${esc(a.body)}</div></div>`).join("")}
  ${isM?`<div class="send" style="margin-top:8px"><input id="a${x.id}" placeholder="Reply as mechanic"><button class="btn" onclick="answer('${x.id}')">Reply</button></div>`
        :(x.answers||[]).length?"":'<div class="meta">Waiting for a mechanic to reply.</div>'}</div>`).join("") || '<div class="empty">No questions yet.</div>'}</div>

async function vote(id, val){
  if (!me) { toast("Log in to react"); return go("login"); }
  const p = posts.find(x => x.id === id), cur = p.post_votes.find(x => x.user_id === me.id); let r;
  if (cur && cur.value === val) {
    r = await db.from("post_votes").delete().eq("post_id",id).eq("user_id",me.id);
    if (!r.error) p.post_votes = p.post_votes.filter(x => x.user_id !== me.id);
  } else {
    r = await db.from("post_votes").upsert({ post_id:id, user_id:me.id, value:val }, { onConflict:"post_id,user_id" });
    if (!r.error) { p.post_votes = p.post_votes.filter(x => x.user_id !== me.id); p.post_votes.push({ user_id:me.id, value:val }); }

  const img = c.listing_photos?.[0] ? `background-image:url('${photoUrl(c.listing_photos[0].path)}')` : "";

  <div class="body"><span class="tag" style="align-self:flex-start">Vehicle for sale</span><div class="price">${fmt(c.price)}</div><strong>${c.year} ${esc(c.make)} ${esc(c.model)}</strong><div class="meta">${esc(c.town)}</div></div></article>`;
}
async function home(){
  feedRender = null;
  $("#view").innerHTML = '<div class="feedcol"><div id="plist"><div class="empty">Loading your home...</div></div></div>';
  const [gp, vs, mm] = await Promise.all([
    db.from("posts").select(POST_SEL).not("group_id","is",null).order("created_at",{ascending:false}).limit(40),
    db.from("listings").select("*, listing_photos(path), profiles!listings_seller_id_fkey(full_name, role, verified, followers_count, avatar_path)").eq("status","approved").order("created_at",{ascending:false}).limit(20),
    me ? db.from("group_members").select("group_id").eq("user_id",me.id) : Promise.resolve({data:[]})]);
  if (gp.error || vs.error) { $("#plist").innerHTML = `<div class="empty">${esc((gp.error || vs.error).message)}</div>`; return; }
  const mine = new Set((mm.data||[]).map(x => x.group_id));
  const P = [...shuf(gp.data.filter(p => mine.has(p.group_id))), ...shuf(gp.data.filter(p => !mine.has(p.group_id)))], V = shuf(vs.data);
  cars = vs.data; const items = [];
  while (P.length || V.length) {
    if ((items.length % 3 === 2 && V.length) || !P.length) items.push({ t:"v", c:V.shift() }); else items.push({ t:"p", p:P.shift() });
  }
  homeItems = items; posts = items.filter(x => x.t === "p").map(x => x.p);
  feedRender = () => homeItems.map(x => x.t === "p" ? postHtml(x.p) : homeVeh(x.c)).join("") || '<div class="empty">Nothing here yet. Join a group or post a vehicle.</div>';
  drawFeed();
}

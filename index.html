<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8eefa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TUchat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef1f4;--card:#ffffff;--ink:#1f2933;--mute:#66707c;--line:#dde2e8;--accent:#d9a62e;--green:#2f7d5b;--bar:#243342;--shadow:0 1px 3px rgba(31,41,51,.08),0 4px 14px rgba(31,41,51,.05)}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222b;--ink:#e8ebee;--mute:#98a3b0;--line:#2b3541;--green:#58b88f;--bar:#0d1217;--shadow:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
header{background:#1b2430;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.3rem}h1 span{background:var(--accent);color:#1b2430;padding:0 8px;border-radius:4px;margin-right:6px}
nav{display:flex;gap:4px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:9px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mute)}
nav button.on{background:var(--accent);color:#1b2430}
main{max-width:980px;margin:0 auto;padding:16px}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
.btn{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:600;background:var(--accent);color:#1b2430;text-decoration:none;text-align:center;display:inline-block}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:#25a244;color:#fff}.btn.bad{background:#b3261e;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.car,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel{padding:14px;margin-bottom:14px}
.pic{height:170px;background:#2f5d7c center/cover}
.body{padding:12px;display:flex;flex-direction:column;gap:4px}
.price{font-weight:800;font-size:1.2rem}.meta{color:var(--mute);font-size:.88rem}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.co{border-color:var(--green);color:var(--green)}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/3}
@media(max-width:560px){.f{grid-template-columns:1fr}.f .w{grid-column:1}}
.filters{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-bottom:14px}
.empty{color:var(--mute);padding:24px;text-align:center}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.chat{display:grid;grid-template-columns:240px 1fr;gap:12px}
@media(max-width:700px){.chat{grid-template-columns:1fr}}
.threads button{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:6px;cursor:pointer;font:inherit}
.threads button.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.msgs{display:flex;flex-direction:column;gap:6px;min-height:220px;max-height:340px;overflow-y:auto;margin-bottom:10px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.m.me{align-self:flex-end;background:var(--accent);color:#1b2430;border-color:transparent}
.send{display:flex;gap:8px}
.q{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ans{margin:6px 0 0 14px;padding-left:10px;border-left:3px solid var(--green)}
.pimg{width:100%;max-height:520px;object-fit:cover;display:block;background:#2f5d7c}
.acts .btn{padding:8px 6px}.acts .sel{background:var(--accent);color:#1b2430;border-color:transparent}
.lnk{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:.85rem;padding:4px 0}
.feedcol{max-width:560px;margin:0 auto}

/* ===== softer look ===== */
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:var(--bar)}
nav{background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
nav button{border-radius:10px}
nav button.on{background:var(--accent);color:#1f2933}
.car,.panel{border-radius:14px;box-shadow:var(--shadow);border-color:var(--line)}
.btn{background:var(--accent);color:#1f2933;border-radius:10px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#2f8f5b;color:#fff}.btn.bad{background:#b04a45;color:#fff}
input,select,textarea{border-radius:10px;background:var(--card);color:var(--ink)}
.price{color:var(--ink)}
.grid.mini{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mini .pic{height:110px}.mini .body{padding:10px;gap:2px}.mini .price{font-size:1rem}.mini strong{font-size:.92rem}
.car.click{cursor:pointer;transition:transform .12s,box-shadow .12s}
.car.click:hover{transform:translateY(-2px)}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:8px;cursor:pointer;border:1px solid var(--line)}
.replies{margin-left:16px;border-left:2px solid var(--line);padding-left:8px}
#toast{background:var(--bar)}

.avatar{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#1f2933;font-weight:800;cursor:pointer;overflow:hidden;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}.avatar.sm{width:34px;height:34px}.avatar.big{width:72px;height:72px;font-size:1.8rem;cursor:default}
.un{color:inherit;text-decoration:none;font-weight:700;cursor:pointer}.un:hover{text-decoration:underline}
.crown{vertical-align:-3px;margin-left:4px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}

nav{display:flex;justify-content:space-around;gap:0;padding:0 4px;position:sticky;top:0;z-index:6;overflow-x:auto}
nav .ic{flex:1;min-width:38px;max-width:84px;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 4px;color:var(--mute);cursor:pointer;display:flex;justify-content:center}
nav .ic.on{background:none;color:var(--ink);border-bottom-color:var(--accent)}
nav .ic:hover{color:var(--ink)}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav svg,.pick svg{width:24px;height:24px}.bi{width:20px;height:20px}
.pick{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;max-width:100%}
.pick:hover{color:var(--ink);border-color:var(--accent)}.pick input{display:none}.pick .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{margin:4px 6px 4px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer;font:inherit}
.crown{stroke:none}
.pgrid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}

.bar{position:sticky;top:0;z-index:20;background:var(--card);box-shadow:var(--shadow);border-bottom:1px solid var(--line)}
header{background:var(--card);color:var(--ink);padding:10px 12px 6px;flex-wrap:nowrap}
header .l,header .r{display:flex;gap:8px;align-items:center}
.circ{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;overflow:hidden;font:inherit;font-weight:800;font-size:1.1rem}
.circ svg{width:22px;height:22px}.circ img{width:100%;height:100%;object-fit:cover}.circ.on{box-shadow:0 0 0 2px var(--accent)}
nav{position:static;box-shadow:none;border-bottom:0;padding:0 4px}
.menu{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:200px;z-index:40;padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--ink);font:inherit;cursor:pointer}
.menu button:hover{background:var(--bg)}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45)}
.sheetbox{background:var(--card);width:100%;max-width:560px;max-height:82vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:0 -4px 24px rgba(0,0,0,.25)}
.sheethead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheetlist{overflow-y:auto;padding:4px 14px 10px;flex:1;min-height:120px}
.sheetin{padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.vt{vertical-align:-3px;margin-left:3px}
.crow{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow)}
.crow .avatar{width:46px;height:46px;cursor:pointer}.cbody{flex:1;min-width:0}.ctop{display:flex;gap:6px;align-items:center}.ctop .meta{margin-left:auto}
.csub{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crow.unread .csub{font-weight:700;color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:#1d9bf0;flex:none}

/* ===== TUchat look ===== */
:root{--accent:#4a74d9;--on-accent:#ffffff;--head:#e8eefa}
:root[data-theme="dark"]{--accent:#6b93ec;--on-accent:#0d1117;--head:#182436}
header{background:var(--head)}
h1{font-size:1.35rem;letter-spacing:-.3px}h1 b{color:var(--accent)}
.lg{width:24px;height:24px;stroke:var(--accent);fill:var(--accent);fill-opacity:.18;vertical-align:-4px;margin-right:6px}
.btn{color:var(--on-accent)}.btn.alt{color:var(--ink)}.avatar{color:var(--on-accent)}
nav .ic svg,.circ svg{transition:transform .15s}
nav .ic:active svg,.circ:active svg{transform:scale(.8)}.circ:active{transform:scale(.92)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.28)}100%{transform:scale(1)}}
nav .ic.on svg,.circ.on svg{animation:pop .38s ease}
.circ{transition:transform .12s,box-shadow .2s}
.cwin{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px;padding:0;overflow:hidden}
.chead{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--head);border-bottom:1px solid var(--line)}
.chead .avatar{width:42px;height:42px}
.cwin .msgs{flex:1;max-height:none;margin:0;padding:14px 12px;gap:4px;background:linear-gradient(180deg,var(--bg),var(--card))}
.m{position:relative;max-width:78%;padding:8px 12px 18px;border-radius:18px 18px 18px 6px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);word-wrap:break-word;min-width:64px}
.m.me{border-radius:18px 18px 6px 18px;background:var(--accent);color:var(--on-accent);border-color:transparent}
.bt{position:absolute;right:10px;bottom:3px;font-size:.66rem;opacity:.7}
.cin{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
.cin input{border-radius:99px;padding:11px 16px;background:var(--bg)}
.sendbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .12s}
.sendbtn:active{transform:scale(.88)}.sendbtn svg{width:20px;height:20px}
.crow{transition:transform .12s}.crow:active{transform:scale(.98)}
.reel{position:relative;background:#000;border-radius:16px;overflow:hidden;margin-bottom:14px}
.rv{width:100%;height:min(78vh,640px);object-fit:cover;display:block;background:#000;cursor:pointer}
.rmute{position:absolute;top:10px;right:10px;border:0;border-radius:50%;width:38px;height:38px;background:rgba(0,0,0,.5);color:#fff;cursor:pointer}
.rcap{position:absolute;left:12px;right:84px;bottom:14px;color:#fff;text-shadow:0 1px 4px #000}.rcap .un{color:#fff}
.racts{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:10px}
.racts button{display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.5);color:#fff;border:0;border-radius:24px;padding:8px 10px;font-size:1.15rem;cursor:pointer}
.racts span{font-size:.74rem}.racts .sel{background:var(--accent)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font:inherit;transition:transform .12s}
.iconbtn:active{transform:scale(.88)}.iconbtn svg{width:22px;height:22px}
.cin .norm{display:flex;gap:8px;align-items:center;flex:1}.cin .norm input[id=mi]{flex:1}
.cin .recbar{display:none;flex:1;align-items:center;gap:10px}.cin.recording .norm{display:none}.cin.recording .recbar{display:flex}
.recdot{width:11px;height:11px;border-radius:50%;background:#e0443e;animation:rp 1s infinite}
@keyframes rp{50%{opacity:.25}}
.mimg{max-width:100%;max-height:300px;border-radius:12px;display:block;margin-bottom:4px;cursor:pointer;background:var(--bg);min-height:60px;min-width:120px}
.m audio{display:block;width:230px;max-width:100%;height:38px;margin-bottom:6px}
.ic{position:relative}
.badge{position:absolute;top:3px;left:calc(50% + 6px);background:#e0443e;color:#fff;font-size:.66rem;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;animation:pop .35s ease}
.sn{font-size:.74rem;font-weight:700;color:var(--accent);margin-bottom:2px}.m.me .sn{display:none}
.gp{display:flex;gap:8px;align-items:center;padding:6px 0;cursor:pointer}.gp input{width:auto}
.collage{display:grid;gap:3px;height:360px;background:var(--bg)}
.collage > *{width:100%;height:100%;min-height:0;object-fit:cover;display:block;cursor:pointer;background:var(--line)}
.L-side{grid-template-columns:1fr 1fr}.L-stack{grid-template-rows:1fr 1fr}
.L-big-left{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.L-big-left > :first-child{grid-row:span 2}
.L-big-top{grid-template-columns:1fr 1fr;grid-template-rows:2fr 1fr}.L-big-top > :first-child{grid-column:span 2}
.L-row3{grid-template-columns:repeat(3,1fr)}
.L-grid4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.L-big-top4{grid-template-columns:repeat(3,1fr);grid-template-rows:2fr 1fr}.L-big-top4 > :first-child{grid-column:span 3}
.L-mosaic5{grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr}.L-mosaic5 > :nth-child(-n+2){grid-column:span 3}.L-mosaic5 > :nth-child(n+3){grid-column:span 2}
.L-grid6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.lay{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lopt{border:2px solid var(--line);border-radius:10px;padding:3px;background:var(--card);cursor:pointer}.lopt.sel{border-color:var(--accent)}
.lopt .collage{width:52px;height:52px;gap:2px}.lopt .collage > *{cursor:pointer}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:70;display:flex;align-items:center;justify-content:center}#lightbox img{max-width:100%;max-height:100%}
#copymenu{position:fixed;z-index:80;background:#1f2933;color:#fff;border-radius:10px;padding:3px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
#copymenu button{background:none;border:0;color:#fff;padding:9px 18px;font:inherit;cursor:pointer}
.m,.cap,.ans > div{-webkit-user-select:text;user-select:text}
#hn{position:relative;overflow:visible}.nbadge{position:absolute;top:-3px;right:-3px;background:#e0443e;color:#fff;font-size:.65rem;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nbadge[hidden]{display:none}#hn #ni{display:flex}
.fbtn{background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;padding:2px 11px;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;margin-left:8px;vertical-align:1px}
.fbtn:active{transform:scale(.92)}.rcap .fbtn{background:#fff;color:#1f2933}
.abar{display:flex;margin:4px -12px -12px;background:var(--head);border-top:1px solid var(--line)}
.ab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:0;color:var(--ink);padding:7px 4px;cursor:pointer;font:inherit;font-size:.85rem;transition:transform .12s}
.ab svg{width:20px;height:20px}.ab:active{transform:scale(.88)}.ab.sel{color:var(--accent)}.ab.sel svg{fill:var(--accent);fill-opacity:.2}
.flip{transform:rotate(180deg)}
.racts svg{width:22px;height:22px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px}
.sbub{flex:none;width:72px;text-align:center;cursor:pointer}
.sring{position:relative;width:68px;height:68px;margin:0 auto}.sring .ring{position:absolute;inset:0}
.sprev{position:absolute;left:7px;top:7px;width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--line) center/cover no-repeat}
.sprev.av{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;background:var(--accent);color:var(--on-accent);overflow:hidden}.sprev.av img{width:100%;height:100%;object-fit:cover}
.splus{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;line-height:1}
.sname{font-size:.74rem;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#storyview{position:fixed;inset:0;background:#000;z-index:90;display:flex;align-items:center;justify-content:center}
.sv-media{max-width:100%;max-height:100%;object-fit:contain}
.sv-bars{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.sv-bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden;position:relative}
.sv-bars span.done{background:#fff}.sv-bars span.cur::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:svp 5s linear forwards}
@keyframes svp{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sv-head{position:absolute;top:22px;left:12px;right:12px;display:flex;gap:8px;align-items:center;color:#fff;z-index:3}
.sv-prev,.sv-next{position:absolute;top:70px;bottom:0;width:40%;z-index:2}.sv-prev{left:0}.sv-next{right:0}
/* bigger action icons, full-width posts, left-side reel icons */
.ab{padding:11px 4px}.ab svg{width:23px;height:23px}
.racts{left:10px;right:auto;bottom:14px}.racts button{background:transparent;padding:6px 8px;text-shadow:0 1px 3px #000}
.racts svg{width:28px;height:28px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}.racts span{font-size:.8rem}
.racts .sel{background:transparent;color:var(--accent)}.racts .sel svg{fill:var(--accent);fill-opacity:.35}
.rcap{left:78px;right:12px}
.reel{height:calc(100dvh - 170px);min-height:420px;max-height:780px}.rv{height:100%}
.menu button{white-space:nowrap}
@media(max-width:600px){.pcard,.reel{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0;box-shadow:none}}
.spin{position:relative;width:46px;height:46px;margin:6px auto;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);border-right-color:var(--accent);animation:spin .85s linear infinite}
.spin::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--accent);opacity:.3;animation:beat 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes beat{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}
#copymenu .del{color:#ff8a80}

<body>
<div class="bar"><header>
<div class="l"><button id="back" class="circ" style="display:none" onclick="goBack()" aria-label="Go back">←</button><h1><svg class="lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>TU<b>chat</b></h1></div>
<div class="r"><button id="hs" class="circ" onclick="go('search')" aria-label="Search"></button>
<button id="hi" class="circ" onclick="openCreate('post')" aria-label="Create"></button>
<button id="hn" class="circ" onclick="go('notifs')" aria-label="Notifications"><span id="ni"></span><span id="nb" class="nbadge" hidden></span></button>
<div style="position:relative"><button id="hp" class="circ" onclick="toggleMenu(event)" aria-label="Profile and settings"></button><div id="menu" class="menu" hidden></div></div></div>
</header><nav id="nav"></nav></div>
<main id="view"></main>
<button id="inst" class="btn" style="display:none;position:fixed;right:14px;bottom:14px;z-index:8">Install app</button>
<div id="toast" role="status"></div>
<script>
// ====== STEP 1: PASTE YOUR TWO SUPABASE VALUES BETWEEN THE QUOTES ======
const SUPABASE_URL = "https://odvraclnvjwlvzrmjxsn.supabase.co";
const SUPABASE_KEY = "sb_publishable_RkQVJ7BZ6kCSApLunK9fMw_I92Zg7JJ";
// =======================================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storage: window.localStorage } });
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => "KSh " + Number(n).toLocaleString("en-KE");
const photoUrl = p => db.storage.from("vehicle-photos").getPublicUrl(p).data.publicUrl;
let me = null, profile = null, tab = "home", cars = [], fq = "", fm = "";

function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",3000)}

async function refreshUser(){
  const { data:{ user } } = await db.auth.getUser();
  me = user; profile = null;
  if (me) { const { data } = await db.from("profiles").select("*").eq("id", me.id).single(); profile = data; }
  if (!booted) { booted = true; if (me) { tab = "chats"; history.replaceState({ name:"tab", arg:"chats", d:0 }, ""); } }
  $("#hp").innerHTML = me ? avatarInner(profile) : ICON.login;
  drawNav(); render(); if (me) { updateBadge(); startNotifs(); loadFollows(); } else unreadN = 0;
}
async function logout(){ if (nchan) { db.removeChannel(nchan); nchan = null; } setNB(0); await db.auth.signOut(); tab="home"; refreshUser(); }

function drawNav(){
  const t = [["home","Home"]];
  if (me) t.push(["chats","Chats"]);
  t.push(["reels","Reels"],["groups","Groups"]);
  if (me) t.push(["friends","Friends"]);
  $("#nav").innerHTML = t.map(([k,v]) => `<button class="ic ${k===tab?"on":""}" title="${v}" aria-label="${v}" onclick="go('${k}')">${ICON[k]}${k === "chats" && unreadN ? `<span class="badge">${unreadN > 9 ? "9+" : unreadN}</span>` : ""}</button>`).join("");
  $("#hs").classList.toggle("on", tab === "search"); $("#hn").classList.toggle("on", tab === "notifs");
}
function go(t, quiet){ closeSheet(); closeStory(); tab=t; drawNav(); render(); if (!quiet) push("tab", t); }
function render(){ (({home, browse, sell, admin, login, mech, chat, feed, groups, search, friends, chats, reels, notifs})[tab] || (() => {}))(); }

// ---------- Browse ----------
async function browse(){
  $("#view").innerHTML = '<div class="empty"><div class="spin"></div></div>';
  const { data, error } = await db.from("listings")
    .select("*, listing_photos(path), profiles!listings_seller_id_fkey(full_name, business_name, role, verified, followers_count, avatar_path)")
    .eq("status","approved").order("created_at",{ascending:false});
  if (error) { $("#view").innerHTML = `<div class="empty">Could not load: ${esc(error.message)}</div>`; return; }
  cars = data; drawCars(true);
}
function drawCars(first){
  const makes = [...new Set(cars.map(c=>c.make))].sort();
  const list = cars.filter(c => (c.make+" "+c.model+" "+c.town).toLowerCase().includes(fq.toLowerCase()) && (!fm || c.make===fm));
  $("#view").innerHTML = `<div class="filters"><input id="fq" placeholder="Search make, model or town" value="${esc(fq)}">
  <select id="fm"><option value="">All makes</option>${makes.map(m=>`<option ${m===fm?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
  <div class="grid mini">${list.map(miniCard).join("") || '<div class="empty">No approved vehicles yet. Be the first to post one.</div>'}</div>`;
  $("#fq").oninput = e => { fq=e.target.value; const p=e.target.selectionStart; drawCars(); const n=$("#fq"); n.focus(); n.setSelectionRange(p,p); };
  $("#fm").onchange = e => { fm=e.target.value; drawCars(); };
}
function card(c){
  const img = c.listing_photos?.[0] ? `style="background-image:url('${photoUrl(c.listing_photos[0].path)}')"` : "";
  const s = c.profiles || {}; const co = s.role === "company";
  const wa = String(c.whatsapp||"").replace(/\D/g,"");
  return `<article class="car"><div class="pic" ${img}></div><div class="body">
  <div class="price">${fmt(c.price)}</div><strong>${c.year} ${esc(c.make)} ${esc(c.model)}</strong>
  <div class="meta">${esc(c.town)}</div>
  <div><span class="tag ${co?"co":""}">${co?"Company":"Private"}${s.verified?" · Verified":""}</span> ${esc(s.business_name || s.full_name || "")}</div>
  <div class="meta">${esc(c.description||"")}</div>
  <div class="row"><button class="btn" onclick="openChat('${c.id}','${c.seller_id}')">Chat</button>${wa?`<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent("Hi, is the "+c.year+" "+c.make+" "+c.model+" still available?")}">WhatsApp</a>`:""}
  <button class="btn alt" onclick="reportListing('${c.id}')">Report</button></div></div></article>`;
}
async function reportListing(id){
  if (!me) { toast("Log in to report a listing"); return go("login"); }
  const reason = await askText("Why are you reporting this listing?", "Report"); if (!reason) return;
  const { error } = await db.from("reports").insert({ listing_id:id, reporter_id:me.id, reason });
  toast(error ? error.message : "Thanks, we will check it");
}

// ---------- Sell ----------
function sell(){
  $("#view").innerHTML = `<div class="panel"><h2>List a vehicle for free</h2>
  <p class="meta">Your ad appears after we check it.</p>
  <form class="f" id="sf"><div><label>Make</label><input name="make" required placeholder="Toyota"></div>
  <div><label>Model</label><input name="model" required placeholder="Axio"></div>
  <div><label>Year</label><input name="year" type="number" min="1980" max="2030" required value="2015"></div>
  <div><label>Price (KSh)</label><input name="price" type="number" min="1" required></div>
  <div><label>Town</label><input name="town" required placeholder="Nairobi"></div>
  <div><label>WhatsApp number</label><input name="whatsapp" required placeholder="2547XXXXXXXX"></div>
  <div class="w"><label>Description</label><textarea name="description" rows="3"></textarea></div>
  <div class="w"><label>Photos (1 to 6, real photos of the vehicle)</label>${pick("photos","image/*",true,"Add photos")}</div>
  <div class="w"><button class="btn" id="sb" type="submit">Submit listing</button></div></form></div>`;
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target); const files = [...e.target.photos.files].slice(0,6); if (!files.length) return toast("Add at least one photo");
    $("#sb").disabled = true; $("#sb").textContent = "Uploading...";
    const { data:l, error } = await db.from("listings").insert({
      seller_id: me.id, make:f.get("make"), model:f.get("model"), year:+f.get("year"), price:+f.get("price"),
      town:f.get("town"), whatsapp:f.get("whatsapp"), description:f.get("description") }).select().single();
    if (error) { toast(error.message); $("#sb").disabled=false; $("#sb").textContent="Submit listing"; return; }
    for (let i=0;i<files.length;i++){
      const blob = await shrink(files[i]); const path = `${me.id}/${l.id}-${i}.jpg`;
      const up = await db.storage.from("vehicle-photos").upload(path, blob, {contentType:"image/jpeg"});
      if (!up.error) await db.from("listing_photos").insert({ listing_id:l.id, path });
    }
    toast("Submitted. It will show once approved."); go("browse");
  };
}
function shrink(file){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1000/img.width);const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};img.src=URL.createObjectURL(file)})}

// ---------- Admin ----------
async function admin(){
  const { data, error } = await db.from("listings").select("*, listing_photos(path)").eq("status","pending").order("created_at");
  if (error) { $("#view").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  $("#view").innerHTML = data.length ? `<div class="grid">${data.map(c=>card(c).replace(/<div class="row">.*<\/div><\/div><\/article>$/s,
    `<div class="row"><button class="btn" onclick="decide('${c.id}','approved')">Approve</button><button class="btn bad" onclick="decide('${c.id}','rejected')">Reject</button></div></div></article>`)).join("")}</div>`
    : '<div class="empty">Nothing waiting for approval.</div>';
}
async function decide(id, status){
  const { error } = await db.from("listings").update({ status }).eq("id", id);
  toast(error ? error.message : "Listing " + status); admin();
}

// ---------- Log in / Sign up ----------
function login(){
  $("#view").innerHTML = `<div class="panel"><h2>Log in</h2><form class="f" id="lf">
  <div><label>Email</label><input name="email" type="email" required></div>
  <div><label>Password</label><input name="password" type="password" required></div>
  <div class="w"><button class="btn" type="submit">Log in</button></div></form></div>
  <div class="panel"><h2>New here? Sign up</h2><form class="f" id="sg">
  <div><label>Your name</label><input name="full_name" required></div>
  <div><label>Phone</label><input name="phone" placeholder="2547XXXXXXXX"></div>
  <div><label>Email</label><input name="email" type="email" required></div>
  <div><label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required></div>
  
  <div class="w"><button class="btn" type="submit">Create account</button></div></form></div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
    const { error } = await db.auth.signInWithPassword({ email:f.email, password:f.password });
    if (error) return toast(error.message); tab="chats"; refreshUser(); };
  $("#sg").onsubmit = async e => { e.preventDefault(); const f=Object.fromEntries(new FormData(e.target));
    const { data, error } = await db.auth.signUp({ email:f.email, password:f.password, options:{ data:{ full_name:f.full_name, phone:f.phone, role:f.role } } });
    if (error) return toast(error.message);
    if (!data.session) return toast("Check your email to confirm, then log in");
    tab="chats"; refreshUser(); };
}

// ---------- Chat ----------
let activeConv = null, chan = null, shown = new Set();
async function openChat(listingId, sellerId){
  if (!me) { toast("Log in to chat with the seller"); return go("login"); }
  if (me.id === sellerId) return toast("This is your own listing");
  let { data:c } = await db.from("conversations").select("id").eq("listing_id",listingId).eq("buyer_id",me.id).maybeSingle();
  if (!c) {
    const r = await db.from("conversations").insert({ listing_id:listingId, buyer_id:me.id, seller_id:sellerId }).select("id").single();
    if (r.error) return toast(r.error.message);
    c = r.data;
  }
  activeConv = c.id; go("chat");
}
const hm = t => new Date(t).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
const bubble = m => {
  if (!vis(m)) return "";
  const own = m.sender_id === me.id;
  if (m.deleted_at) return `<div class="m del ${own ? "me" : ""}" data-mid="${m.id}" data-own="${own ? 1 : 0}">${ICON.ban}<i> This message was deleted</i></div>`;
  const nm = bnames && !own ? `<div class="sn">${esc(bnames[m.sender_id] || "User")}</div>` : "";
  return `<div class="m ${own ? "me" : ""}" data-mid="${m.id}" data-own="${own ? 1 : 0}" data-txt="${!m.media_path && !m.view_once && m.body ? 1 : ""}">${nm}${mediaHtml(m, own)}${m.body ? esc(m.body) : ""}<span class="bt">${m.edited_at ? "edited · " : ""}${hm(m.created_at)}${own ? tickHtml(m) : ""}</span></div>`;
};
function addMsg(m){
  if (shown.has(m.id)) return; shown.add(m.id);
  const box = $("#ms"); if (!box) return;
  hideTyping(); box.insertAdjacentHTML("beforeend", bubble(m)); box.scrollTop = box.scrollHeight; hydrate(box);
}
async function chat(){
  if (!me) return go("login");
  $("#view").innerHTML = '<div class="empty"><div class="spin"></div></div>';
  const { data:convs, error } = await db.from("conversations")
    .select("id,buyer_id,seller_id,listings(make,model,year),buyer:profiles!conversations_buyer_id_fkey(full_name),seller:profiles!conversations_seller_id_fkey(full_name)")
    .order("created_at",{ascending:false});
  if (error) { $("#view").innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  if (!convs.length) { $("#view").innerHTML = '<div class="empty">No conversations yet. Open a vehicle and tap Chat to message the seller.</div>'; return; }
  if (!convs.find(c => c.id === activeConv)) activeConv = convs[0].id; markSeen(activeConv);
  const title = c => { const l=c.listings; const other = me.id===c.buyer_id ? c.seller : c.buyer;
    return esc((l ? l.year+" "+l.make+" "+l.model : "Vehicle") + " · " + (other?.full_name || "User")); };

function goBack(){ if (depth > 0) history.back(); else go(me ? "chats" : "home", true); }
function restore(st){ ({ tab:()=>go(st.arg,true), car:()=>openCar(st.arg,true), profile:()=>openProfile(st.arg,true), dm:()=>openDm(st.arg,true), gc:()=>openGc(st.arg,true), post:()=>openPost(st.arg,true), group:()=>openGroup(st.arg,true) })[st.name]?.(); }

async function toggleJoin(gid, st, privacy, where){
  if (!me) { toast("Log in to join groups"); return go("login"); }
  if (st === "active" && !(await ask("Leave this group?", "Leave"))) return;
  const r = st ? await db.from("group_members").delete().eq("group_id",gid).eq("user_id",me.id)
               : await db.from("group_members").insert({ group_id:gid, user_id:me.id, status: privacy === "private" ? "pending" : "active" });
  if (r.error) toast(r.error.message); else if (!st && privacy === "private") toast("Request sent. The owner will review it.");
  where === "group" ? openGroup(gid, true) : groups();
}
async function memberAct(gid, uid, kind){
  const r = kind === "approve" ? await db.from("group_members").update({ status:"active" }).eq("group_id",gid).eq("user_id",uid)
                               : await db.from("group_members").delete().eq("group_id",gid).eq("user_id",uid);

async function reels(){
  feedRender = null;
  document.documentElement.style.setProperty("--barh", (document.querySelector(".bar")?.offsetHeight || 112) + "px");
  $("#view").innerHTML = '<div class="feedcol"><div id="plist" class="reelwrap"><div class="empty"><div class="spin"></div></div></div></div>' + (me ? `<button class="reelplus" onclick="openCreate('reel')" aria-label="Create a reel">${ICON.plus}</button>` : "");
  const r = await db.from("posts").select(POST_SEL).eq("is_reel", true).order("created_at",{ascending:false}).limit(30);
  if (r.error) { $("#plist").innerHTML = `<div class="empty">${esc(r.error.message)}</div>`; return; }
  if (reelObs) reelObs.disconnect();
  reelObs = new IntersectionObserver(es => es.forEach(e => { const v = e.target; if (e.intersectionRatio >= 0.65) { v.muted = reelMuted; v.play().catch(() => {}); } else v.pause(); }), { root:$("#plist"), threshold:[0, 0.65, 1] });
  posts = r.data; feedRender = () => posts.map(reelHtml).join("") || '<div class="empty" style="color:#fff">No reels yet. Share the first one.</div>'; drawFeed();
}

const pick = (id, accept, multiple, text) => `<label class="pick" title="Choose from your gallery">${ICON.feed}<span class="pn">${text}</span>
  <input id="${id}" name="${id}" type="file" accept="${accept}" ${multiple ? "multiple" : ""} onchange="this.parentNode.querySelector('.pn').textContent=this.files.length>1?this.files.length+' files selected':(this.files[0]?.name||'${text}')"></label>`;
async function uploadMedia(f){
  const vid = f.type.startsWith("video/");
  if (!(await screenFile(f))) return { error:{ message:"This looks inappropriate, so it can't be posted." } };
  if (vid && f.size > 30*1024*1024) return { error:{ message:"Video is too large (maximum 30 MB)" } };
  const ext = vid ? (f.name.split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"") || "mp4") : "jpg";
  const path = `${me.id}/post-${Date.now()}.${ext}`;
  const up = await db.storage.from("vehicle-photos").upload(path, vid ? f : await shrink(f), { contentType: vid ? f.type : "image/jpeg" });
  return up.error ? { error:up.error } : { path, type: vid ? "video" : "image" };
}

const recent = () => { try { return JSON.parse(localStorage.getItem("gs-recent") || "[]"); } catch (e) { return []; } };
function clearRecent(){ try { localStorage.removeItem("gs-recent"); } catch (e) {} search(); }
function search(){
  feedRender = null;
  $("#view").innerHTML = `<div class="feedcol"><form id="sf2" class="send" style="margin-bottom:12px"><input id="sq" placeholder="Search people, groups and posts" maxlength="60">
    <button class="btn" type="submit" aria-label="Search" style="padding:8px 12px">${ICON.search.replace("<svg","<svg class='bi'")}</button></form><div id="sr"></div></div>`;
  const r = recent();
  $("#sr").innerHTML = r.length ? `<div class="panel"><h3>Recent searches</h3>${r.map(x => `<button class="chip" data-q="${esc(x)}" onclick="runSearch(this.dataset.q)">🕘 ${esc(x)}</button>`).join("")}<div><button class="lnk" onclick="clearRecent()">Clear recent searches</button></div></div>` : '<div class="empty">Type something to search.</div>';
  $("#sf2").onsubmit = e => { e.preventDefault(); runSearch($("#sq").value); };

async function runSearch(q){
  q = (q || "").trim().replace(/[,()%*]/g, " ").trim(); if (q.length < 2) return toast("Type at least 2 letters");
  $("#sq").value = q;
  try { localStorage.setItem("gs-recent", JSON.stringify([q, ...recent().filter(x => x !== q)].slice(0, 8))); } catch (e) {}
  $("#sr").innerHTML = '<div class="empty"><div class="spin"></div></div>'; const l = `%${q}%`;
  const [u, g, p] = await Promise.all([
    db.from("profiles").select("id,full_name,business_name,avatar_path,followers_count,verified").or(`full_name.ilike.${l},business_name.ilike.${l}`).limit(8),
    db.from("groups").select("id,name,description,privacy").or(`name.ilike.${l},description.ilike.${l}`).limit(6),
    db.from("posts").select(POST_SEL).ilike("caption", l).order("created_at",{ascending:false}).limit(10)]);
  posts = p.data || []; feedRender = null;
  const sec = (title, arr, html) => arr?.length ? `<h3>${title}</h3>${html}` : "";
  const out = sec("People", u.data, `<div class="panel">${(u.data||[]).map(o => `<div class="q" style="display:flex;gap:10px;align-items:center"><button class="avatar sm" onclick="openProfile('${o.id}')">${avatarInner(o)}</button>${nameLink({full_name:o.business_name||o.full_name,followers_count:o.followers_count,verified:o.verified},o.id)}</div>`).join("")}</div>`)
    + sec("Groups", g.data, (g.data||[]).map(x => `<article class="panel car click" onclick="openGroup('${x.id}')"><strong>${esc(x.name)}</strong><div class="meta">${lock(x.privacy)}</div><div class="meta">${esc(x.description||"")}</div></article>`).join(""))
    + (posts.length ? '<h3>Posts</h3><div id="plist"></div>' : "");
  $("#sr").innerHTML = out || `<div class="empty">No results for "${esc(q)}".</div>`;
  if (posts.length) drawFeed();
}

// ---------- Friends ----------
const pairFilter = (a, b) => `and(requester_id.eq.${a},addressee_id.eq.${b}),and(requester_id.eq.${b},addressee_id.eq.${a})`;
function friendBtn(f, uid){
  if (!f) return `<button class="btn alt" onclick="friendAct('add','${uid}')">Add friend</button>`;
  if (f.status === "accepted") return `<button class="btn" onclick="openDm('${uid}')">Message</button>`;
  return f.requester_id === me?.id ? `<button class="btn alt" onclick="friendAct('cancel','${uid}')">Request sent ✕</button>`
                                   : `<button class="btn" onclick="friendAct('accept','${uid}')">Accept request</button>`;
}
async function friendAct(kind, uid){
  if (!me) { toast("Log in first"); return go("login"); }
  let r;
  if (kind === "add") r = await db.from("friendships").insert({ requester_id:me.id, addressee_id:uid });
  else if (kind === "accept") r = await db.from("friendships").update({ status:"accepted" }).eq("requester_id",uid).eq("addressee_id",me.id);
  else r = await db.from("friendships").delete().or(pairFilter(me.id, uid));
  if (r.error) toast(r.error.message); else toast(kind === "add" ? "Friend request sent" : kind === "accept" ? "You are now friends" : "Done");
  tab === "friends" ? friends() : openProfile(uid, true);
}

    let file = null; w.querySelector("#gpf").onchange = e => { file = e.target.files[0]; if (file) { w.querySelector(".gpic").style.backgroundImage = `url(${URL.createObjectURL(file)})`; w.querySelector("#gpv").style.display = "none"; } };
    w.querySelector("[data-c]").onclick = () => done(null);
    w.querySelector("[data-ok]").onclick = async () => {
      const name = w.querySelector("#gpn").value.trim(), ids = [...w.querySelectorAll(".gpk:checked")].map(x => x.value), b = w.querySelector("[data-ok]");
      if (name.length < 2) return toast("Give the group a name"); if (!ids.length) return toast("Pick at least one person");
      b.disabled = true; b.textContent = "Creating..."; const fail = m => { toast(m); b.disabled = false; b.textContent = "Create group"; };
      let avatar = null; if (file) { const up = await uploadMedia(file); if (up.error) return fail(up.error.message); avatar = up.path; }
      const r = await db.from("gchats").insert({ name, description:w.querySelector("#gpd").value.trim() || null, avatar_path:avatar, created_by:me.id }).select("id").single(); if (r.error) return fail(r.error.message);
      const m = await db.from("gchat_members").insert(ids.map(u => ({ chat_id:r.data.id, user_id:u }))); if (m.error) toast(m.error.message);
      done(null); openGc(r.data.id);
    };
  });
}
async function openGcInfo(id){
  const [g, mem] = await Promise.all([db.from("gchats").select("id,name,description,avatar_path,created_by").eq("id", id).single(),
    db.from("gchat_members").select("user_id,profiles!gchat_members_user_id_fkey(full_name,avatar_path,followers_count,verified)").eq("chat_id", id)]);
  if (g.error) return toast(g.error.message);
  const G = g.data, admin = G.created_by === me.id, ms = mem.data || [];
  dialog(`<div style="text-align:center"><div class="avatar big" style="margin:0 auto 8px">${avatarInner({ full_name:G.name, avatar_path:G.avatar_path })}</div>
    ${admin ? `<label class="pick" style="margin-bottom:8px">${ICON.feed}<span class="pn">Change group photo</span><input id="gif" type="file" accept="image/*" hidden></label>` : ""}</div>
    ${admin ? `<input id="gin" value="${esc(G.name)}" maxlength="60"><input id="gdd" value="${esc(G.description || "")}" maxlength="200" placeholder="Description" style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="btn" data-save>Save</button></div>`
            : `<h3 style="text-align:center;margin:0">${esc(G.name)}</h3><div class="meta" style="text-align:center">${esc(G.description || "")}</div>`}
    <div class="meta" style="margin:14px 0 4px">Members (${ms.length})</div><div class="plist">${ms.map(x => `<div class="q" style="display:flex;gap:10px;align-items:center"><span class="avatar sm" style="cursor:default">${avatarInner(x.profiles)}</span><div style="flex:1">${esc(x.profiles?.full_name || "User")}${x.user_id === G.created_by ? ' <span class="tag">Admin</span>' : ""}</div>
      ${admin && x.user_id !== me.id ? `<button class="btn alt" style="padding:4px 10px" data-rm="${x.user_id}">Remove</button>` : ""}</div>`).join("")}</div>
    <div class="row" style="margin-top:12px">${admin ? '<button class="btn alt" data-add>Add people</button>' : ""}<button class="btn alt" data-leave>Leave group</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" data-close>Close</button></div>`,
  (w, done) => {
    w.querySelector("[data-close]").onclick = () => done(null);
    w.querySelector("[data-leave]").onclick = () => { done(null); leaveGc(id); };
    w.querySelector("[data-add]")?.addEventListener("click", () => { done(null); gcAddPeople(id, ms.map(x => x.user_id)); });
    w.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => { const r = await db.from("gchat_members").delete().eq("chat_id", id).eq("user_id", b.dataset.rm); toast(r.error ? r.error.message : "Removed"); done(null); openGcInfo(id); });
    w.querySelector("[data-save]")?.addEventListener("click", async () => {
      const upd = { name:w.querySelector("#gin").value.trim(), description:w.querySelector("#gdd").value.trim() || null }; if (upd.name.length < 2) return toast("Give the group a name");
      const f = w.querySelector("#gif")?.files[0]; if (f) { const up = await uploadMedia(f); if (up.error) return toast(up.error.message); upd.avatar_path = up.path; }
      const r = await db.from("gchats").update(upd).eq("id", id); toast(r.error ? r.error.message : "Saved"); done(null); if (!r.error) openGc(id, true);
    });
  });
}
async function gcAddPeople(id, existing){
  const fr = (await getFriends()).filter(o => !existing.includes(o.id)); if (!fr.length) return toast("All your friends are already in this group");
  dialog(`<h3 style="margin:0 0 10px">Add people</h3><div class="plist">${fr.map(o => `<label class="gp"><input type="checkbox" class="gpk" value="${o.id}"><span class="avatar sm" style="cursor:default">${avatarInner(o)}</span> ${esc(o.full_name)}</label>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn alt" data-c>Cancel</button><button class="btn" data-ok>Add</button></div>`,
  (w, done) => { w.querySelector("[data-c]").onclick = () => done(null);
    w.querySelector("[data-ok]").onclick = async () => { const ids = [...w.querySelectorAll(".gpk:checked")].map(x => x.value); if (!ids.length) return toast("Pick at least one person");
      const r = await db.from("gchat_members").insert(ids.map(u => ({ chat_id:id, user_id:u }))); toast(r.error ? r.error.message : "Added"); done(null); openGc(id, true); }; });
}

// ---------- Chat colours, photo cropper, music ----------
let avatarBlob = null, musicAudio = null, musicBtn = null;
const chatColor = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360} ${38 + (h >> 3) % 14}% 40%)`; };
function setChatColor(){ document.querySelector(".cwin")?.style.setProperty("--chat-accent", chatColor(curThread)); }
function cropImage(file, out = 400){
  return new Promise(async res => {
    const img = new Image(); img.src = URL.createObjectURL(file); try { await img.decode(); } catch (e) { return res(null); }
    const S = 280; let z = 1, ox = 0, oy = 0; const base = () => Math.max(S / img.width, S / img.height);
    const clamp = () => { const w = img.width * base() * z, h = img.height * base() * z; ox = Math.min(0, Math.max(S - w, ox)); oy = Math.min(0, Math.max(S - h, oy)); };
    dialog(`<h3 style="margin:0 0 10px">Adjust your photo</h3><div class="crop"><canvas id="cv" width="${S}" height="${S}"></canvas></div>
      <input type="range" id="zm" min="1" max="3" step="0.01" value="1" style="margin-top:12px;padding:0"><p class="meta" style="margin:6px 0 0;font-weight:400">Drag the photo to move it. Use the slider to zoom.</p>
      <div class="row" style="margin-top:12px"><button class="btn alt" data-c>Cancel</button><button class="btn" data-ok>Use photo</button></div>`,
    (w, done) => {
      const cv = w.querySelector("#cv"), cx = cv.getContext("2d");
      const draw = () => { clamp(); const sc = base() * z; cx.fillStyle = "#000"; cx.fillRect(0, 0, S, S); cx.drawImage(img, ox, oy, img.width * sc, img.height * sc); };
      ox = (S - img.width * base()) / 2; oy = (S - img.height * base()) / 2; draw();
      let drag = null;
      cv.onpointerdown = e => { drag = [e.clientX, e.clientY, ox, oy]; cv.setPointerCapture(e.pointerId); };
      cv.onpointermove = e => { if (!drag) return; ox = drag[2] + e.clientX - drag[0]; oy = drag[3] + e.clientY - drag[1]; draw(); };
      cv.onpointerup = cv.onpointercancel = () => { drag = null; };
      w.querySelector("#zm").oninput = e => { const c = S / 2, old = base() * z, nz = +e.target.value, nsc = base() * nz; ox = c - (c - ox) * nsc / old; oy = c - (c - oy) * nsc / old; z = nz; draw(); };
      w.querySelector("[data-c]").onclick = () => done(null);
      w.querySelector("[data-ok]").onclick = () => { const k = out / S, oc = document.createElement("canvas"); oc.width = oc.height = out; const sc = base() * z;
        oc.getContext("2d").drawImage(img, ox * k, oy * k, img.width * sc * k, img.height * sc * k); oc.toBlob(b => done(b), "image/jpeg", 0.85); };
    }).then(v => res(v || null));
  });
}
ICON.music = _i('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>');
ICON.play = _i('<path d="M8 5v14l11-7z" fill="currentColor"/>');
ICON.pause = _i('<path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/>');
const musicBar = p => `<div class="music" data-src="${photoUrl(p.music_path)}"><button class="mplay" onclick="toggleMusic(this)" aria-label="Play music">${ICON.play}</button><div class="mt">${ICON.music}<span>${esc(p.music_title || "Music")}</span></div></div>`;
function stopMusic(){ if (musicAudio) musicAudio.pause(); if (musicBtn) musicBtn.innerHTML = ICON.play; musicBtn = null; }
function toggleMusic(btn){
  if (musicBtn === btn) return stopMusic();
  stopMusic(); document.querySelectorAll("video").forEach(v => v.pause());
  musicAudio = musicAudio || new Audio(); musicAudio.src = btn.parentNode.dataset.src; musicAudio.loop = true;
  musicAudio.play().catch(() => toast("Could not play this music")); musicBtn = btn; btn.innerHTML = ICON.pause;
}
function restoreMusic(){
  if (!musicAudio || musicAudio.paused) return; const el = [...document.querySelectorAll(".music")].find(m => m.dataset.src === musicAudio.src);
  if (el) { musicBtn = el.querySelector(".mplay"); musicBtn.innerHTML = ICON.pause; }
}
const musicObs = new IntersectionObserver(es => es.forEach(e => { if (e.intersectionRatio < 0.2 && musicBtn && e.target.contains(musicBtn)) stopMusic(); }), { threshold:[0, 0.2] });
async function uploadAudio(f){
  const ext = (f.name.split(".").pop() || "mp3").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "mp3", path = `${me.id}/music-${Date.now()}.${ext}`;
  const up = await db.storage.from("vehicle-photos").upload(path, f, { contentType: f.type || "audio/mpeg" }); return up.error ? { error:up.error } : { path };
}
document.addEventListener("visibilitychange", () => { if (document.hidden) document.querySelectorAll("video").forEach(v => v.pause()); });
